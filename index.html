<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Precificação Shopee</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #1a1b26;
      color: #a9b1d6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #24283b;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    h2 {
      color: #c0caf5;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.4rem;
      border-bottom: 1px solid #414868;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #7aa2f7;
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #414868;
      border-radius: 6px;
      background-color: #1f2335;
      color: #c0caf5;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus {
      border-color: #7aa2f7;
    }
    .results {
      background-color: #1f2335;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    .result-row.highlight {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px dashed #414868;
      font-weight: bold;
      color: #9ece6a;
      font-size: 1.2rem;
    }
    .value {
      color: #bb9af7;
      font-weight: 600;
    }
    .highlight .value {
      color: #9ece6a;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Calculadora de Precificação Shopee</h2>
  
  <div class="form-group">
    <label for="custoDesejado">Quanto você quer receber no bolso (R$)</label>
    <input type="number" id="custoDesejado" step="0.01" placeholder="Ex: 50.00" oninput="calcularPrecoVenda()">
  </div>

  <div class="results">
    <div class="result-row">
      <span>Faixa Encontrada</span>
      <span class="value" id="faixaFaixa">-</span>
    </div>
    <div class="result-row">
      <span>Comissão (<span id="pctComissao">0</span>%)</span>
      <span class="value" id="valComissao">R$ 0,00</span>
    </div>
    <div class="result-row">
      <span>Taxa Fixa</span>
      <span class="value" id="valTaxaFixa">R$ 0,00</span>
    </div>
    <div class="result-row">
      <span>Total em Taxas</span>
      <span class="value" id="valTotalTaxas">R$ 0,00</span>
    </div>
    <div class="result-row highlight">
      <span>Preço de Venda Sugerido</span>
      <span class="value" id="valPrecoVenda">R$ 0,00</span>
    </div>
  </div>
</div>

<script>
  function calcularPrecoVenda() {
    const valorDesejado = parseFloat(document.getElementById('custoDesejado').value) || 0;

    if (valorDesejado <= 0) {
      limparCampos();
      return;
    }

    // Regras da tabela de taxas (2026):
    // Faixa 1: Preço <= 79.99 (Comissão: 20%, Taxa Fixa: R$ 4.50)
    // Faixa 2: Preço <= 99.99 (Comissão: 14%, Taxa Fixa: R$ 16.00)
    // Faixa 3: Preço <= 199.99 (Comissão: 14%, Taxa Fixa: R$ 20.00)
    // Faixa 4: Preço >= 200.00 (Comissão: 14%, Taxa Fixa: R$ 26.00)

    const faixas = [
      { maxPreco: 79.99, comissao: 0.20, fixa: 4.50, nome: "Até R$ 79,99" },
      { maxPreco: 99.99, comissao: 0.14, fixa: 16.00, nome: "R$ 80,00 a R$ 99,99" },
      { maxPreco: 199.99, comissao: 0.14, fixa: 20.00, nome: "R$ 100,00 a R$ 199,99" },
      { maxPreco: Infinity, comissao: 0.14, fixa: 26.00, nome: "Acima de R$ 200,00" }
    ];

    let precoVendaEncontrado = 0;
    let faixaSelecionada = null;

    // Testa as faixas para encontrar o preço final correto que se enquadra nas regras da tabela
    for (let f of faixas) {
      // Fórmula: Preço = (Valor Desejado + Taxa Fixa) / (1 - Comissão)
      let p = (valorDesejado + f.fixa) / (1 - f.comissao);

      if (p <= f.maxPreco || f.maxPreco === Infinity) {
        precoVendaEncontrado = p;
        faixaSelecionada = f;
        break;
      }
    }

    const valorComissao = precoVendaEncontrado * faixaSelecionada.comissao;
    const totalTaxas = valorComissao + faixaSelecionada.fixa;

    // Atualiza a tela
    document.getElementById('faixaFaixa').innerText = faixaSelecionada.nome;
    document.getElementById('pctComissao').innerText = (faixaSelecionada.comissao * 100).toFixed(0);
    document.getElementById('valComissao').innerText = formatarMoeda(valorComissao);
    document.getElementById('valTaxaFixa').innerText = formatarMoeda(faixaSelecionada.fixa);
    document.getElementById('valTotalTaxas').innerText = formatarMoeda(totalTaxas);
    document.getElementById('valPrecoVenda').innerText = formatarMoeda(precoVendaEncontrado);
  }

  function limparCampos() {
    document.getElementById('faixaFaixa').innerText = '-';
    document.getElementById('pctComissao').innerText = '0';
    document.getElementById('valComissao').innerText = 'R$ 0,00';
    document.getElementById('valTaxaFixa').innerText = 'R$ 0,00';
    document.getElementById('valTotalTaxas').innerText = 'R$ 0,00';
    document.getElementById('valPrecoVenda').innerText = 'R$ 0,00';
  }
